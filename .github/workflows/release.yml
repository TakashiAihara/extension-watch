name: release
on:
  push:
    tags: ["v[0-9]*"]
permissions:
  contents: read
jobs:
  # Runs the dependency code (bun install, playwright, the tests) without any write or OIDC permission.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.5
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun test

  # Holds the write and attestation permissions, so it installs nothing: it runs scripts/pack.sh from the
  # tagged commit with the runner image's git, zip and gh.
  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag must be on main and match the manifest version
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag $GITHUB_REF_NAME is not on main"; exit 1; }
          v="$(jq -r .version extension/manifest.json)"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match manifest version $v"; exit 1; }
      - id: pack
        run: |
          sha256="$(scripts/pack.sh extension-watch.zip)"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: extension-watch.zip
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ steps.pack.outputs.sha256 }}
        run: |
          gh release create "$GITHUB_REF_NAME" extension-watch.zip --verify-tag --title "$GITHUB_REF_NAME" --notes "sha256: \`$SHA256\`

          Rebuild it from this tag with \`scripts/pack.sh\` (Info-ZIP \`zip\`) and compare, or verify the attestation with \`gh attestation verify extension-watch.zip --repo $GITHUB_REPOSITORY\`."
